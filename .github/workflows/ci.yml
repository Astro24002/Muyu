name: CI

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: muyu_test
          POSTGRES_USER: muyu
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U muyu -d muyu_test"
          --health-interval=5s --health-timeout=3s --health-retries=20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://muyu:test-only-password@localhost:5432/muyu_test
      DATABASE_URL: postgresql+psycopg://muyu:test-only-password@localhost:5432/muyu_test
      OTP_PEPPER: ci-only-otp-pepper-with-at-least-thirty-two-characters
      OTP_PROVIDER: fake
      FAKE_OTP_CODE: '000000'
      PUBLIC_BASE_URL: http://localhost:8080
      WEB_COOKIE_SECURE: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: alembic upgrade head
      - run: python -m pytest -q
      - run: python -m compileall -q app alembic

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --dart-define=API_BASE_URL=https://muyu.bkverse.space
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: client/build/app/outputs/flutter-apk/app-debug.apk

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: web/dist

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose version
      - run: make check-deployment
      - run: make boundary-check
      - run: bash -n deploy/scripts/backup-verify.sh deploy/scripts/restore-drill.sh scripts/smoke-cloud-protocol.sh
      - run: ./scripts/assert-no-legacy-runtime.sh
      - run: python3 scripts/check-ci-trigger.py

  cloud-protocol:
    if: ${{ vars.RUN_CLOUD_PROTOCOL == 'true' }}
    needs: [backend, deployment]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: muyu_test
          POSTGRES_USER: muyu
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U muyu -d muyu_test"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e 'backend[dev]'
      - run: |
          nohup uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8080 >/tmp/muyu-api.log 2>&1 &
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://muyu:test-only-password@localhost:5432/muyu_test
          OTP_PEPPER: ci-only-otp-pepper-with-at-least-thirty-two-characters
          OTP_PROVIDER: fake
          FAKE_OTP_CODE: '000000'
          PUBLIC_BASE_URL: http://localhost:8080
          WEB_COOKIE_SECURE: false
      - run: |
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8080/health/ready && exit 0
            sleep 1
          done
          cat /tmp/muyu-api.log
          exit 1
      - run: alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://muyu:test-only-password@localhost:5432/muyu_test
      - run: python -m pytest tests/e2e/test_cloud_protocol.py -q
        working-directory: backend
        env:
          RUN_CLOUD_PROTOCOL: '1'
          CLOUD_PROTOCOL_BASE_URL: http://127.0.0.1:8080
          OTP_CODE_A: '000000'
          OTP_CODE_B: '000000'
      - run: OTP_CODE_A=000000 OTP_CODE_B=000000 API_BASE_URL=http://127.0.0.1:8080 sh scripts/smoke-cloud-protocol.sh

  android-emulator:
    if: ${{ vars.RUN_ANDROID_EMULATOR == 'true' }}
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: client
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: flutter test integration_test/mobile_cloud_flow_test.dart
          working-directory: client
