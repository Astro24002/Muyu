# PostgreSQL is private to the Compose backup and API networks. WAL is archived
# by pgBackRest; credentials and the cipher passphrase arrive at runtime.
listen_addresses = '*'
password_encryption = 'scram-sha-256'
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=muyu archive-push "%p"'
archive_timeout = 60s
max_wal_senders = 3
hot_standby = on
