name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: muyu_test
          POSTGRES_USER: muyu
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U muyu -d muyu_test"
          --health-interval=5s --health-timeout=3s --health-retries=20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://muyu:test-only-password@localhost:5432/muyu_test
      DATABASE_URL: postgresql+psycopg://muyu:test-only-password@localhost:5432/muyu_test
      OTP_PEPPER: release-ci-only-otp-pepper-with-at-least-thirty-two-characters
      OTP_PROVIDER: fake
      FAKE_OTP_CODE: '000000'
      PUBLIC_BASE_URL: http://localhost:8080
      WEB_COOKIE_SECURE: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: alembic upgrade head
      - run: python -m pytest -q
      - run: python -m compileall -q app alembic

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --dart-define=API_BASE_URL=https://muyu.bkverse.space
      - name: Name Android APK with version
        working-directory: client
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          version_name="${RELEASE_TAG}"
          cp build/app/outputs/flutter-apk/app-debug.apk \
            "build/app/outputs/flutter-apk/Muyu-${version_name}.apk"
      - name: Publish version APK to GitHub Release
        if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
        working-directory: client
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          apk_path="build/app/outputs/flutter-apk/Muyu-${RELEASE_TAG}.apk"
          test -f "$apk_path"
          gh release upload "$RELEASE_TAG" "$apk_path" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: release-android-debug-apk-${{ github.ref_name }}
          path: client/build/app/outputs/flutter-apk/Muyu-v*.apk

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: release-web-dist
          path: web/dist

  publish:
    name: publish version APK
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [backend, android, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: release-android-debug-apk-${{ github.ref_name }}
          path: release-assets
      - name: Create Release and attach version APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          apk_path="release-assets/Muyu-${RELEASE_TAG}.apk"
          test -f "$apk_path"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$apk_path" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" "$apk_path" \
              --repo "$GITHUB_REPOSITORY" \
              --title "木鱼协作 $RELEASE_TAG" \
              --notes "Android 客户端版本，下载 Muyu-${RELEASE_TAG}.apk 安装体验。" \
              --verify-tag
          fi

  release:
    needs: [backend, android, web]
    if: ${{ github.event_name == 'release' && github.event.action == 'published' && vars.ENABLE_SIGNED_RELEASE == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate release signing inputs
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" || { echo 'ANDROID_KEYSTORE_BASE64 is required' >&2; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'ANDROID_KEYSTORE_PASSWORD is required' >&2; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'ANDROID_KEY_ALIAS is required' >&2; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'ANDROID_KEY_PASSWORD is required' >&2; exit 1; }
      - name: Build signed Android and Web artifacts
        working-directory: client
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -Eeuo pipefail
          key_path="$RUNNER_TEMP/muyu-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode >"$key_path"
          export ANDROID_KEYSTORE_PATH="$key_path"
          trap 'rm -f "$key_path"' EXIT
          flutter pub get
          flutter build appbundle --release --dart-define=API_BASE_URL=https://muyu.bkverse.space
          cd ../web
          npm ci
          npm run build
          tar -czf web-release.tar.gz -C dist .
          sha256sum ../client/build/app/outputs/bundle/release/app-release.aab web-release.tar.gz > SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > SOURCE_COMMIT
          printf '%s\n' "$RELEASE_TAG" > RELEASE_TAG
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.event.release.tag_name || github.ref_name }}
          path: |
            client/build/app/outputs/bundle/release/app-release.aab
            web/web-release.tar.gz
            web/SHA256SUMS
            web/SOURCE_COMMIT
            web/RELEASE_TAG
